server:
  port: 8081
spring:
  application:
    name: zhixing-tianxia
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/zhixing?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    database: 11
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 60000
    # 生产端可靠性：confirm 确认消息到达 broker，return 捕获路由失败
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: 1
        max-concurrency: 5
        prefetch: 1
        # 消费端手动 ack：处理成功才确认，失败 nack 进死信队列
        acknowledge-mode: manual

# AI 智能线路规划（LangChain4j 对接阿里云百炼 DashScope OpenAI 兼容接口）
ai:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  temperature: 0.7

# 图片上传目录（攻略配图）
zhixing:
  upload:
    dir: ./upload/imgs/


mybatis-plus:
  type-aliases-package: com.zhixing.entity # 别名扫描包
  global-config:
    db-config:
      logic-delete-field: isDeleted  # 全局逻辑删除的实体字段名
      logic-delete-value: 1          # 逻辑删除值（被删除）
      logic-not-delete-value: 0      # 逻辑未删除值（正常）
logging:
  level:
    com.zhixing: debug

