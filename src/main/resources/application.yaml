server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hema_dp?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    database: 11
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 60000
    listener:
      simple:
        concurrency: 1
        max-concurrency: 5
        prefetch: 1


mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  global-config:
    db-config:
      logic-delete-field: isDeleted  # 全局逻辑删除的实体字段名
      logic-delete-value: 1          # 逻辑删除值（被删除）
      logic-not-delete-value: 0      # 逻辑未删除值（正常）
logging:
  level:
    com.hmdp: debug
